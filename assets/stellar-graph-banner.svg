<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Stellar Graph by Lightbrush</title>
  <desc id="desc">Lightbrush-branded banner for the Stellar Graph Obsidian plugin.</desc>
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06fbfc" stop-opacity="1"/>
      <stop offset="42%" stop-color="#14d7f2" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#14d7f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strokeGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06fbfc"/>
      <stop offset="55%" stop-color="#14d7f2"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.84 0 0 0 0 0.95 0 0 0 .95 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#14d7f2" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <style>
      .bg { fill: #020408; }
      .grid { fill: url(#grid); opacity: .75; }
      .orbit { fill: none; stroke: #14d7f2; stroke-opacity: .2; stroke-width: 1.3; }
      .link { stroke: url(#strokeGlow); stroke-opacity: .48; stroke-width: 1.6; }
      .node { fill: #14d7f2; filter: url(#bloom); }
      .node.dark { fill: #6366f1; }
      .label { fill: #e2e8f0; font-family: Rajdhani, "Space Grotesk", Inter, Arial, sans-serif; font-weight: 700; letter-spacing: 0; }
      .sub { fill: #94a3b8; font-family: "Space Grotesk", Inter, Arial, sans-serif; letter-spacing: 0; }
      .mono { fill: #14d7f2; font-family: "JetBrains Mono", Consolas, monospace; letter-spacing: 0; }
      .scan { fill: #06fbfc; opacity: .1; }
      .pulse { transform-origin: 458px 214px; animation: pulse 3.8s ease-in-out infinite; }
      .spin { transform-origin: 458px 214px; animation: spin 18s linear infinite; }
      .floatA { animation: floatA 5.5s ease-in-out infinite; }
      .floatB { animation: floatB 6.3s ease-in-out infinite; }
      .scanMove { animation: scanMove 4.5s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { transform: scale(.96); opacity: .8; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-13px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(11px); } }
      @keyframes scanMove { 0%,100% { transform: translateX(-220px); opacity: 0; } 35%,70% { opacity: .15; } 100% { transform: translateX(1220px); } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .spin, .floatA, .floatB, .scanMove { animation: none; }
      }
    </style>
  </defs>
  <rect class="bg" width="1600" height="420" rx="0"/>
  <rect class="grid" width="1600" height="420"/>
  <rect class="scan scanMove" x="0" y="0" width="170" height="420"/>
  <circle cx="1220" cy="90" r="330" fill="url(#coreGlow)" opacity=".42"/>
  <circle cx="270" cy="350" r="260" fill="url(#coreGlow)" opacity=".28"/>
  <g transform="translate(18 10)" opacity=".95">
    <g class="spin">
      <ellipse class="orbit" cx="458" cy="214" rx="268" ry="92"/>
      <ellipse class="orbit" cx="458" cy="214" rx="268" ry="92" transform="rotate(60 458 214)"/>
      <ellipse class="orbit" cx="458" cy="214" rx="268" ry="92" transform="rotate(120 458 214)"/>
    </g>
    <g class="floatA">
      <line class="link" x1="300" y1="132" x2="458" y2="214"/>
      <line class="link" x1="458" y1="214" x2="638" y2="160"/>
      <line class="link" x1="458" y1="214" x2="574" y2="306"/>
      <line class="link" x1="318" y1="292" x2="458" y2="214"/>
      <circle class="node" cx="300" cy="132" r="13"/>
      <circle class="node dark" cx="638" cy="160" r="17"/>
      <circle class="node" cx="574" cy="306" r="12"/>
      <circle class="node dark" cx="318" cy="292" r="15"/>
    </g>
    <g class="floatB">
      <line class="link" x1="392" y1="72" x2="458" y2="214"/>
      <line class="link" x1="458" y1="214" x2="690" y2="246"/>
      <circle class="node" cx="392" cy="72" r="10"/>
      <circle class="node" cx="690" cy="246" r="11"/>
    </g>
    <circle class="node pulse" cx="458" cy="214" r="32"/>
  </g>
  <g transform="translate(760 118)">
    <text class="mono" x="0" y="0" font-size="24">LIGHTBRUSH PRESENTS</text>
    <text class="label" x="0" y="86" font-size="86">Stellar Graph</text>
    <text class="sub" x="4" y="136" font-size="30">A local 3D graph for notes, agents, sources, and briefs</text>
    <text class="mono" x="4" y="190" font-size="22">Created with love by Lightbrush, TaoBot, and Digi-Dali</text>
  </g>
</svg>
